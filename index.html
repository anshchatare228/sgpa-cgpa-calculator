<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-800">
    <!-- Main Container -->
    <div class="min-h-screen bg-zinc-800 flex items-center justify-center p-4">
        <div class="w-full max-w-4xl bg-white/70 shadow-xl rounded-xl p-6 md:p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Academic Calculator</h1>

            <!-- SGPA Section -->
            <section id="sgpa-section" class="mb-10">
                <h2 class="text-xl font-semibold text-purple-800 mb-4 border-b pb-2">Step 1: Calculate SGPA</h2>
                <div id="subject-rows" class="space-y-4">
                    <!-- Subject Header (Desktop) -->
                    <div class="hidden md:flex justify-around font-medium text-gray-600 mb-2 px-2">
                        <div>Subject</div>
                        <div>Theory Grade</div>
                        <div>Practical Grade</div>
                        <div>Credits</div>
                        <div>Action</div>
                    </div>

                    <!-- Template Row (One subject) -->
                    <div class="subject-row grid grid-cols-1 md:grid-cols-5 gap-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                        <select class="p-2 border rounded focus:ring-2 focus:ring-indigo-400 outline-none">
                            <option value="maths-2">M-2</option>
                            <option value="be">BE</option>
                            <option value="bee">BEE</option>
                            <option value="physics">Physics</option>
                            <option value="pps">PPS</option>
                            <option value="exploration">Exploration Engg.</option>
                        </select>

                        <p class="md:hidden pt-1 mb-[-1rem]">Theory</p>
                        <select class="theory-grade p-2 border rounded focus:ring-2 focus:ring-indigo-400">
                            <option value="9">A+ (9)</option>
                            <!-- Add other grades -->
                        </select>
                        
                        
                        <p class="md:hidden pt-1 mb-[-1rem]">practical</p>
                        <select class="practical-grade p-2 border rounded focus:ring-2 focus:ring-indigo-400">
                            <option value="9">A+ (9)</option>
                            <!-- Add other grades -->
                        </select>

                        <input type="number" placeholder="Credits" class="credits p-2 border rounded focus:ring-2 focus:ring-indigo-400 outline-none">
                        
                        <button class="remove-btn bg-red-500 text-white py-2 px-4 rounded hover:bg-red-600 transition">Remove</button>
                    </div>
                </div>

                <div class="mt-4 flex flex-col sm:flex-row gap-3">
                    <button id="add-subject" class="bg-indigo-500 text-white py-2 px-6 rounded-lg hover:bg-indigo-600 font-medium">Add Subject</button>
                    <button id="calc-sgpa" class="bg-green-600 text-white py-2 px-6 rounded-lg hover:bg-green-700 font-medium">Calculate SGPA</button>
                </div>
                
                <div id="sgpa-result" class="mt-4 p-4 bg-indigo-50 text-indigo-800 rounded-lg text-lg font-bold text-center hidden">
                    Your SGPA: <span id="sgpa-value">0.00</span>
                </div>
            </section>

            <!-- CGPA Section -->
            <section id="cgpa-section" class="pt-6 border-t">
                <h2 class="text-xl font-semibold text-purple-600 mb-4 border-b pb-2">Step 2: Calculate CGPA</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Previous Semester CGPA/SGPA</label>
                        <input type="number" step="0.01" id="prev-sgpa" placeholder="Enter Sem 1 SGPA" class="w-full p-2 border rounded focus:ring-2 focus:ring-purple-400 outline-none">
                    </div>
                    <div class="flex items-end">
                        <button id="calc-cgpa" class="w-full bg-purple-600 text-white py-2 px-6 rounded-lg hover:bg-purple-700 font-medium">Calculate Overall CGPA</button>
                    </div>
                </div>

                <div id="cgpa-result" class="mt-6 p-4 bg-purple-50 text-purple-800 rounded-lg text-2xl font-bold text-center hidden">
                    Cumulative CGPA: <span id="cgpa-value">0.00</span>
                </div>
            </section>
        </div>
    </div>

</body>
</html>
