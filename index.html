<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPA calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-800">
    <video id="bgVid" autoplay muted loop class="fixed -z-10 h-full w-full object-cover brightness-75" src="307818_medium.mp4" type="video/mp4"></video>
    <!-- Perspective Wrapper -->
    <div id="selectorPage" class=" h-screen flex items-center justify-center p-6 [perspective:1000px] overflow-hidden">
        
        <!-- The Flipper Container -->
        <div id="main-flipper" class="relative w-full max-w-2xl transition-all mt-[-3rem] duration-1000 [transform-style:preserve-3d]">
            
            <!-- SIDE 1: SEMESTER SELECTOR -->
            <div class="[backface-visibility:hidden] [transform-style:preserve-3d] w-full">
                <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-10 shadow-2xl text-center">
                    <h1 class="text-4xl font-extrabold text-white mb-8 tracking-tight">Select Your Semester</h1>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Sem 1 Button -->
                        <button id="sem1" onclick="selectSemester('sem1')" class="group relative bg-white/5 hover:bg-emerald-600/0 border border-white/10 hover:border-emerald-600/50 rounded-2xl p-8 transition-all duration-300 transform hover:-translate-y-2 hover:shadow-xl">
                            <div class="text-6xl font-bold text-white/20 group-hover:text-emerald-600/30 absolute top-4 right-6 transition-all group-hover:scale-125 duration-300">1</div>
                            <h2 class="text-2xl font-bold text-white mb-2 text-left">Semester 1</h2>
                            <p class="text-gray-400 text-sm text-left leading-relaxed">Freshman Year</p>
                            <div class="mt-6 flex items-center text-emerald-600/30 font-semibold text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-500">Select this semester →</div>
                        </button>

                        <!-- Sem 2 Button -->
                        <button id="sem2" onclick="selectSemester('sem2')" class="group relative bg-white/5 hover:bg-white/0 border border-white/10 hover:border-red-600/50 rounded-2xl p-8 transition-all duration-300 transform hover:-translate-y-2 hover:shadow-xl">
                            <div class="text-6xl font-bold text-white/20 group-hover:text-red-400/60 absolute top-4 right-6 transition-all group-hover:scale-110 duration-300">2</div>
                            <h2 class="text-2xl font-bold text-white mb-2 text-left">Semester 2</h2>
                            <p class="text-gray-400 text-sm text-left leading-relaxed">Sophomore Vibes</p>
                            <div class="mt-6 flex items-center text-red-400/90 font-semibold text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-500">Select this semester →</div>
                        </button>
                    </div>
                    <p class="mt-8 text-gray-500 text-xs italic">Step 1: Choose your current semester.</p>
                </div>
            </div>

            <!-- SIDE 2: STRUCTURE SELECTOR (Face Down Initially) -->
            <div class="absolute inset-0 [backface-visibility:hidden] [transform-style:preserve-3d] [transform:rotateY(180deg)] w-full">
                <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-10 shadow-2xl text-center h-full">
                    <h1 class="text-4xl font-extrabold text-white mb-8 tracking-tight">Select Your Structure</h1>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Structure A -->
                        <button onclick="structSelected('A')" id="structA" class="group relative bg-white/5 hover:bg-white/0 border border-white/10 hover:border-emerald-400/50 rounded-2xl p-8 transition-all duration-300 transform hover:-translate-y-2 hover:shadow-xl">
                            <div class="text-6xl font-bold text-white/20 group-hover:text-emerald-400/30 absolute top-4 right-6 transition-colors">A</div>
                            <h2 class="text-2xl font-bold text-white mb-2 text-left ml-[-0.3rem]">Structure A</h2>
                            <p class="text-gray-400 text-sm text-left leading-relaxed">Includes EGD & Physics</p>
                            <div class="mt-6 flex items-center text-emerald-400 font-semibold text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-500">Select →</div>
                        </button>

                        <!-- Structure B -->
                        <button onclick="structSelected('B')" id="structB" class="group relative bg-white/5 hover:bg-white/0 border border-white/10 hover:border-red-600/50 rounded-2xl p-8 transition-all duration-300 transform hover:-translate-y-2 hover:shadow-xl">
                            <div class="text-6xl font-bold text-white/20 group-hover:text-red-400/60 absolute top-4 right-6 transition-colors">B</div>
                            <h2 class="text-2xl font-bold text-white mb-2 text-left">Structure B</h2>
                            <p class="text-gray-400 text-sm text-left leading-relaxed">Includes PPS & Chemistry</p>
                            <div class="mt-6 flex items-center text-red-400/90 font-semibold text-sm opacity-0 group-hover:opacity-100 transition-opacity duration-500">Select →</div>
                        </button>
                    </div>
                    
                    <!-- Back Button -->
                    <button onclick="goBack()" class="mt-6 text-white/50 hover:text-white text-xs underline decoration-dotted">← Back to Semester Selection</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Main Container -->
    <div id="mainPage" class="hidden min-h-screen to-black flex items-center justify-center p-4">
        <div class="w-full max-w-4xl bg-white/50 backdrop-blur-[0.4rem] shadow-xl rounded-xl p-6 md:p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Academic Calculator</h1>

            <!-- SGPA Section -->
            <section id="sgpa-section" class="mb-10">
                <h2 class="text-xl font-semibold text-purple-800 mb-4 border-b pb-2">Step 1: Calculate SGPA</h2>
                <div class="space-y-4">
                    <!-- Subject Header (Desktop) -->
                    <div class="hidden md:flex justify-around font-medium text-gray-600 mb-2 px-2">
                        <div>Subject</div>
                        <div>Theory Grade</div>
                        <div>Practical Grade</div>
                        <div>Action</div>
                    </div>
                    
                    <!-- Template Row (One subject) -->
                    <div id="subjectRows" class="subjectRows grid grid-cols-1 md:flex md:flex-col gap-4 p-4 bg-white/10 backdrop-blur-sm rounded-lg border border-gray-200">



                    
                    </div>
                </div>

                <div class="mt-4 flex flex-col sm:flex-row gap-3">
                    <button id="calc-sgpa" class="bg-green-600 text-white py-2 px-6 rounded-lg hover:bg-green-700 font-medium">Calculate SGPA</button>
                </div>
                
                <div id="sgpa-result" class="mt-4 p-4 bg-indigo-50 text-indigo-800 rounded-lg text-lg font-bold text-center hidden">
                    Your SGPA: <span id="sgpa-value">0.00</span>
                </div>
            </section>

            <!-- CGPA Section -->
            <section id="cgpa-section" class="pt-6 border-t">
                <h2 class="text-xl font-semibold text-purple-600 mb-4 border-b pb-2">Step 2: Calculate CGPA</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Previous Semester CGPA/SGPA</label>
                        <input type="number" step="0.01" id="prev-sgpa" placeholder="Enter Sem 1 SGPA" class="w-full p-2 border rounded focus:ring-2 focus:ring-purple-400 outline-none">
                    </div>
                    <div class="flex items-end">
                        <button id="calc-cgpa" class="w-full bg-purple-600 text-white py-2 px-6 rounded-lg hover:bg-purple-700 font-medium">Calculate Overall CGPA</button>
                    </div>
                </div>

                <div id="cgpa-result" class="mt-6 p-4 bg-purple-50 text-purple-800 rounded-lg text-2xl font-bold text-center hidden">
                    Cumulative CGPA: <span id="cgpa-value">0.00</span>
                </div>
            </section>
        </div>
    </div>
</body>
<script defer src="main1.js"></script>
</html>
